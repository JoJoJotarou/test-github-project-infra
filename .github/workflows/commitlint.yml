name: Lint Commit Messages

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Same pinned npx invocation as the local hook — one verified mechanism
      # instead of trusting a third-party action to resolve `extends` the same
      # way. Lints every commit in the PR, not just the tip.
      - name: Run commitlint
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          npx --yes @commitlint/cli@21.2.3 \
            --config .commitlintrc.json \
            --from origin/${{ github.base_ref }} --to HEAD

  title-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Squash merge turns the PR title into the commit message, and nothing
      # else lints it. The title goes through an env var, never interpolated
      # into the shell. Keep the pipeline inside a `run: |` block: a plain
      # multi-line scalar folds `\` and `|` onto one line, and the escaped
      # space then becomes an extra printf argument that appends a space to
      # the title — which header-trim rejects.
      - name: Run commitlint on the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$TITLE" \
            | npx --yes @commitlint/cli@21.2.3 --config .commitlintrc.json
