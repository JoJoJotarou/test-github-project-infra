name: Release & Changelog

on:
  # This repo's trunk is `master`.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog and Bump Version
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --bump
        env:
          OUTPUT: CHANGELOG.md

      - name: Check Version
        id: check_version
        run: |
          TAG="${{ steps.cliff.outputs.version }}"
          if [ -z "$TAG" ]; then
            echo "has_release=false" >> $GITHUB_OUTPUT
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists; nothing to release" >> $GITHUB_STEP_SUMMARY
            echo "has_release=false" >> $GITHUB_OUTPUT
          else
            echo "has_release=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      # Branch protection rejects a direct push to the trunk, so the changelog
      # is not committed to `master`; it ships in the release notes instead.
      # (A changelog pull request is not an option either: events created with
      # GITHUB_TOKEN do not start workflow runs, so such a PR could never
      # satisfy the required checks.)
      - name: Tag the release
        if: steps.check_version.outputs.has_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.check_version.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.check_version.outputs.has_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          body: ${{ steps.cliff.outputs.content }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generated changelog
        if: steps.check_version.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ steps.check_version.outputs.tag }}
          path: CHANGELOG.md
          retention-days: 30
