name: Release & Changelog

on:
  # This repo's trunk is `master`.
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Needed to open the changelog pull request below.
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog and Bump Version
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --bump
        env:
          OUTPUT: CHANGELOG.md

      - name: Check Version
        id: check_version
        run: |
          TAG="${{ steps.cliff.outputs.version }}"
          if [ -z "$TAG" ]; then
            echo "has_release=false" >> $GITHUB_OUTPUT
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists; nothing to release" >> $GITHUB_STEP_SUMMARY
            echo "has_release=false" >> $GITHUB_OUTPUT
          else
            echo "has_release=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      # Branch protection rejects a direct push to the trunk, so the changelog
      # reaches `master` through a pull request instead.
      - name: Commit CHANGELOG on a release branch
        if: steps.check_version.outputs.has_release == 'true'
        run: |
          TAG="${{ steps.check_version.outputs.tag }}"
          BRANCH="chore/changelog-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for $TAG [skip ci]"
          git push --force origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
        id: changelog_branch

      - name: Open changelog pull request
        if: steps.check_version.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check_version.outputs.tag }}
          BRANCH: ${{ steps.changelog_branch.outputs.branch }}
        run: |
          gh pr create --base master --head "$BRANCH" \
            --title "docs: update changelog for $TAG" \
            --body "Automated changelog update for $TAG." \
          || gh pr view "$BRANCH" --json number --jq .number
          gh pr merge "$BRANCH" --squash --auto || echo "auto-merge unavailable; merge the PR by hand"

      - name: Tag the release
        if: steps.check_version.outputs.has_release == 'true'
        run: |
          TAG="${{ steps.check_version.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.check_version.outputs.has_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          body: ${{ steps.cliff.outputs.content }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
