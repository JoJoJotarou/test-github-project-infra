# lefthook.yml — the commit-msg block belongs to release-pipeline-setup, the
# pre-commit block to ci-pipeline-setup. One file, two owners.
commit-msg:
  commands:
    commitlint:
      # Pinned: `--yes` alone always grabs latest, so a major bump of
      # @commitlint/cli or @commitlint/config-conventional would silently
      # rewrite the rules this gate enforces.
      run: npx --yes @commitlint/cli@21.2.3 --config .commitlintrc.json --edit {1}
